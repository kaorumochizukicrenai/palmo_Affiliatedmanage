<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>確認ページ</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f6f7fb;
            color: #111827;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 28px 24px;
            box-shadow: 0 12px 32px rgba(17, 24, 39, 0.08);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
            line-height: 1.4;
        }

        p {
            margin: 0 0 18px;
            color: #4b5563;
            line-height: 1.8;
            font-size: 14px;
        }

        .status-box {
            margin: 0 0 18px;
            padding: 12px 14px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            color: #374151;
            font-size: 13px;
            word-break: break-all;
        }

        .button {
            width: 100%;
            appearance: none;
            border: none;
            border-radius: 12px;
            padding: 14px 16px;
            background: #111827;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 14px;
            min-height: 22px;
            font-size: 14px;
            color: #374151;
        }

        .result.error {
            color: #b91c1c;
        }

        .result.success {
            color: #166534;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>確認ページ</h1>
        <p>
            誤判定を避けるため、このページを実際に開いた記録は<br>
            下のボタンを押したときだけ行います。
        </p>

        <div id="statusBox" class="status-box">status: -</div>

        <button id="confirmButton" class="button" type="button">このページを開いたことを記録する</button>
        <div id="result" class="result" aria-live="polite"></div>
    </div>

    <script>
        (() => {
            /*
             * ここを書き換えてください
             * 例: https://tool.example.com/click.php
             */
            const CLICK_API_URL = "https://test-lineautomation.f5.si/click.php";

            const params = new URLSearchParams(window.location.search);
            const status = (params.get("status") || "").trim();

            const statusBox = document.getElementById("statusBox");
            const button = document.getElementById("confirmButton");
            const result = document.getElementById("result");

            statusBox.textContent = "status: " + (status || "-");

            function setMessage(message, type = "") {
                result.textContent = message;
                result.className = "result" + (type ? " " + type : "");
            }

            button.addEventListener("click", async () => {
                if (!status) {
                    setMessage("status がありません。", "error");
                    return;
                }

                button.disabled = true;
                setMessage("記録中です...");

                try {
                    const response = await fetch(CLICK_API_URL, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ status })
                    });

                    const data = await response.json();

                    if (!response.ok || !data.success) {
                        throw new Error(data.message || "記録に失敗しました。");
                    }

                    setMessage("記録しました。この画面は閉じて問題ありません。", "success");
                } catch (error) {
                    setMessage(error.message || "記録に失敗しました。", "error");
                    button.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
